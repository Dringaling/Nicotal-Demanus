<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nicotal - Demanus{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-center">
        <a class="brand" href="/">Nicotal - Demanus</a>
        <nav class="nav-links">
          <a class="nav-button" href="/">Tạo</a>
          <a class="nav-button" href="/review">Review</a>
        </nav>
      </div>
      {% if server_url %}<span class="server-url">{{ server_url }}</span>{% endif %}
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
