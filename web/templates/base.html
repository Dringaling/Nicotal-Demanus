<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Demanus{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Demanus</a>
      <span class="tag">Sinh PPTX từ mô tả</span>
      <nav class="nav-links">
        <a href="/">Tạo</a>
        <a href="/review">Review</a>
      </nav>
      {% if server_url %}<span class="server-url">{{ server_url }}</span>{% endif %}
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
