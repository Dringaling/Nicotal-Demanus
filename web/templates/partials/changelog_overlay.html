<button class="changelog-button" type="button" data-changelog>
  CHI TIẾT CẬP NHẬT
</button>
<div class="changelog-overlay" data-changelog-overlay hidden>
  <div class="changelog-dialog" role="dialog" aria-modal="true"
       aria-labelledby="changelog-title" data-changelog-dialog>
    <div class="changelog-head">
      <h2 id="changelog-title">Chi tiết cập nhật</h2>
      <button class="icon" type="button" data-changelog-close
              aria-label="Đóng chi tiết cập nhật">×</button>
    </div>
    <div class="changelog-body" data-changelog-body></div>
  </div>
</div>
