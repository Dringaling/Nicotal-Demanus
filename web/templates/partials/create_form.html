{% from "macros.html" import template_select %}
<h1>Tạo bài trình bày</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/generate" class="form">
  <label>
    Tiêu đề
    <div class="title-row">
      <input name="title" maxlength="200" required
             value="{{ form.get('title', '') }}"
             data-check-url="/api/inputs/check-title"
             placeholder="Kiểm soát nhiễm khuẩn trong nội nha">
      <span class="field-ok" data-title-ok hidden aria-hidden="true">✓</span>
    </div>
    <p class="field-error" data-title-error hidden role="alert"></p>
  </label>
  <label>
    Mô tả
    <textarea name="description" rows="3" required
              placeholder="Slide làm nội dung gì, khoảng bao nhiêu slide...">{{ form.get('description', '') }}</textarea>
  </label>
  <label>
    Chi tiết
    <textarea name="details" rows="10" required
              placeholder="Nội dung chi tiết từng slide...">{{ form.get('details', '') }}</textarea>
  </label>
  <label>
    Tags
    <div class="tag-input" id="tag-input">
      <div class="tag-chips" id="tag-chips"></div>
      <input id="tag-entry" list="tag-suggestions"
             placeholder="Nhập tag rồi Enter">
    </div>
    <input type="hidden" name="tags" id="tags-hidden"
           value="{{ form.get('tags', '') }}">
  </label>
  <label>
    Template
    {{ template_select(template_groups, form.get('template', 'flat')) }}
  </label>
  <button type="submit">Sinh file PPTX</button>
</form>
