<form class="search-bar" method="get" action="/">
  {% if active_tag %}<input type="hidden" name="tag" value="{{ active_tag }}">{% endif %}
  <input type="search" name="q" value="{{ query }}"
         placeholder="Tìm theo tên..." aria-label="Tìm input theo tên">
  <button type="submit">Tìm</button>
  {% if query %}
  <a class="button secondary" title="Xoá tìm kiếm"
     href="/{% if active_tag %}?tag={{ active_tag | urlencode }}{% endif %}">x</a>
  {% endif %}
</form>
