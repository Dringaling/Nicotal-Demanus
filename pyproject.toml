[project]
name = "demanus"
version = "0.1.0"
description = "Sinh bài trình bày PowerPoint tiếng Việt từ mô tả bằng python-pptx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-pptx>=1.0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.9",
    "tomli-w>=1.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
preview-aspose = ["aspose-slides>=24.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
