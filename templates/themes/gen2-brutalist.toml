muted = [
    90,
    90,
    90,
]

[variants.alt.colors.background]
hex = "#0A0A0A"
rgb = [
    10,
    10,
    10,
]

[variants.alt.colors.card]
bg_hex = "#0A0A0A"
bg_rgb = [
    10,
    10,
    10,
]
border_hex = "#0A0A0A"
border_rgb = [
    10,
    10,
    10,
]
border_width_pt = 5.0

[variants.alt.colors.accent]
primary_hex = "#FF3B00"
primary_rgb = [
    255,
    59,
    0,
]
secondary_hex = "#0047FF"
secondary_rgb = [
    0,
    71,
    255,
]
success_hex = "#00C853"
success_rgb = [
    0,
