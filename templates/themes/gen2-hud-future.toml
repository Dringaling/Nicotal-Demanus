[theme]
id = "gen2-hud-future"
name = "HUD Future Layout"
description = "Giao diện HUD tương lai với nền teal tối, thẻ góc cạnh, đường kẻ HUD mảnh và số liệu nổi bật, tỷ lệ 16:9, tối ưu tiếng Việt."
style = "hud-future-layout"
tags = [
    "dark",
    "hud",
    "teal",
    "futuristic",
    "tech",
]
renderer = "theme"
font = "Lexend"
title_layout = "split_panel"
header_layout = "rail"
content_layout = "two_column_lists"

[palette]
bg = [
    6,
    22,
    26,
]
card = [
    10,
    34,
    40,
]
accent = [
    45,
    212,
    191,
]
text = [
    226,
    250,
    248,
]
muted = [
    110,
    150,
    156,
]

[canvas]
width_inch = 13.333
height_inch = 7.5
aspect_ratio = "16:9"

[colors.background]
hex = "#06161A"
rgb = [
    6,
    22,
    26,
]

[colors.card]
bg_hex = "#0A2228"
bg_rgb = [
    10,
    34,
    40,
]
border_hex = "#1B4A52"
border_rgb = [
    27,
    74,
    82,
]
border_width_pt = 1.25

[colors.accent]
primary_hex = "#2DD4BF"
primary_rgb = [
    45,
    212,
    191,
]
secondary_hex = "#F5A524"
secondary_rgb = [
    245,
    165,
    36,
]
success_hex = "#4ADE80"
success_rgb = [
    74,
    222,
    128,
]

[colors.text]
primary_hex = "#E2FAF8"
primary_rgb = [
    226,
    250,
    248,
]
secondary_hex = "#6E969C"
secondary_rgb = [
    110,
    150,
    156,
]
accent_hex = "#2DD4BF"
accent_rgb = [
    45,
    212,
    191,
]

[colors.hud]
line_hex = "#1B4A52"
line_rgb = [
    27,
    74,
    82,
]
glow_hex = "#2DD4BF"
glow_rgb = [
    45,
    212,
    191,
]
corner_hex = "#2DD4BF"
corner_rgb = [
    45,
    212,
    191,
]

[typography]
font_family = "Lexend"
font_family_fallback = "Arial"

[typography.title_hero]
size_pt = 42
bold = true
color = "colors.text.primary_rgb"

[typography.title_section]
size_pt = 24
bold = true
color = "colors.text.primary_rgb"

[typography.card_title]
size_pt = 17
bold = true
color = "colors.text.primary_rgb"

[typography.card_body]
size_pt = 12
bold = false
line_spacing = 1.3
color = "colors.text.secondary_rgb"

[typography.tag]
size_pt = 9
bold = true
color = "colors.accent.primary_rgb"

[typography.big_metric]
size_pt = 54
bold = true
color = "colors.accent.primary_rgb"

[typography.metric_label]
size_pt = 13
bold = true
color = "colors.text.primary_rgb"

[layouts.hero_title]
id = "hud_hero"
description = "Trang bìa HUD với khung góc cạnh, đường kẻ mảnh và tag phân loại"

[layouts.hero_title.card]
shape_type = "RECTANGLE"
left_inch = 0.85
top_inch = 1.1
width_inch = 11.633
height_inch = 5.3
fill = "colors.card.bg_rgb"
border = "colors.card.border_rgb"
corner_radius = 0.0

[layouts.hero_title.elements.tag]
type = "text"
left_inch = 1.35
top_inch = 1.55
width_inch = 6.0
height_inch = 0.35
style = "typography.tag"
default = "// HUD SYSTEM / STATUS: ONLINE"

[layouts.hero_title.elements.title]
type = "text"
left_inch = 1.35
top_inch = 2.1
width_inch = 10.633
height_inch = 1.7
style = "typography.title_hero"
default = "Tiêu đề bản thuyết trình"

[layouts.hero_title.elements.subtitle]
type = "text"
left_inch = 1.35
top_inch = 4.05
width_inch = 8.5
height_inch = 0.9
style = "typography.card_body"
default = "Mô tả ngắn gọn về mục tiêu, giải pháp hoặc lộ trình triển khai"

[layouts.hero_title.elements.metric_strip]
type = "text"
left_inch = 1.35
top_inch = 5.35
width_inch = 10.633
height_inch = 0.55
style = "typography.big_metric"
default = "99.8%"

[layouts.three_cards]
id = "hud_three_columns"
description = "Slide trình bày 3 nội dung, 3 tính năng hoặc 3 bước triển khai theo phong cách HUD"

[layouts.three_cards.header]
left_inch = 0.85
top_inch = 0.55
width_inch = 11.633
height_inch = 0.75
style = "typography.title_section"
default = "3 Trọng Tâm Phát Triển"

[layouts.three_cards.grid_meta]
count = 3
top_inch = 1.75
height_inch = 4.85
width_inch = 3.6
gap_inch = 0.416
left_margin_inch = 0.85

[layouts.three_cards.card_1]
shape_type = "RECTANGLE"
left_inch = 0.85
top_inch = 1.75
width_inch = 3.6
height_inch = 4.85
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "01 / GIAI ĐOẠN 1"
title_default = "Phân tích yêu cầu"
body_default = "Tổng hợp toàn bộ tài liệu đầu vào, lược đồ cơ sở dữ liệu và yêu cầu tích hợp mạng LAN."

[layouts.three_cards.card_2]
shape_type = "RECTANGLE"
left_inch = 4.866
top_inch = 1.75
width_inch = 3.6
height_inch = 4.85
accent_bar_color = "colors.accent.secondary_rgb"
badge_text = "02 / GIAI ĐOẠN 2"
title_default = "Xây dựng lõi"
body_default = "Tạo engine tự sinh mã với python-pptx, tối ưu bảng màu và font tiếng Việt Lexend."

[layouts.three_cards.card_3]
shape_type = "RECTANGLE"
left_inch = 8.882
top_inch = 1.75
width_inch = 3.6
height_inch = 4.85
accent_bar_color = "colors.accent.success_rgb"
badge_text = "03 / GIAI ĐOẠN 3"
title_default = "Triển khai LAN"
body_default = "Chạy máy chủ backend nội bộ, quản trị cơ chế lưu vết TOML an toàn trước khi công khai."

[layouts.metric_highlights]
id = "hud_metrics"
description = "Slide làm nổi bật các con số then chốt, kết quả đạt được theo phong cách HUD"

[layouts.metric_highlights.header]
left_inch = 0.85
top_inch = 0.55
width_inch = 11.633
height_inch = 0.75
style = "typography.title_section"
default = "Kết Quả Đo Lường Hiệu Năng"

[layouts.metric_highlights.card_left]
left_inch = 0.85
top_inch = 1.75
width_inch = 5.6
height_inch = 4.85
metric_number = "99.8%"
metric_label = "Độ chính xác bố cục"
metric_desc = "Tự động căn chỉnh tọa độ vector chính xác không bị tràn chữ tiếng Việt nhờ font Lexend."

[layouts.metric_highlights.card_right]
left_inch = 6.883
top_inch = 1.75
width_inch = 5.6
height_inch = 4.85
metric_number = "< 1.5s"
metric_label = "Thời gian sinh slide"
metric_desc = "Pipeline xử lý trực tiếp trên RAM và xuất file PPTX tức thì trên web server LAN."

[variants.alt]
name = "Alt"
