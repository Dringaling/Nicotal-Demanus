[theme]
id = "neo_tech_minimal"
name = "Neo Tech Minimalist"
description = "Layout dạng Bento/Card khối nổi hiện đại, tỷ lệ 16:9, tối ưu tiếng Việt không dấu/có dấu."
style = "bento-dark"
tags = ["dark", "tech", "bento"]
renderer = "theme"
font = "Lexend"

[palette]
bg = [15, 23, 42]
card = [30, 41, 59]
accent = [56, 189, 248]
text = [248, 250, 252]
muted = [148, 163, 184]

[canvas]
width_inch = 13.333
height_inch = 7.500
aspect_ratio = "16:9"

# -------------------------------------------------------------
# PALETTE MÀU (Hex và RGB đồng thời để dễ debug và map vào python-pptx)
# -------------------------------------------------------------
[colors.background]
hex = "#0F172A"
rgb = [15, 23, 42]        # Slate đậm / Navy sẫm làm nền tổng

[colors.card]
bg_hex = "#1E293B"
bg_rgb = [30, 41, 59]      # Slate khối card
border_hex = "#334155"
border_rgb = [51, 65, 85]  # Border mỏng tinh tế
border_width_pt = 1.0

[colors.accent]
primary_hex = "#38BDF8"
primary_rgb = [56, 189, 248]    # Sky cyan (Nhấn mạnh, tag, số liệu lớn)
secondary_hex = "#F59E0B"
secondary_rgb = [245, 158, 11]  # Amber (Cảnh báo, mốc tiến độ)
success_hex = "#10B981"
success_rgb = [16, 185, 129]   # Emerald green

[colors.text]
primary_hex = "#F8FAFC"
primary_rgb = [248, 250, 252]  # Trắng ngà cho Tiêu đề chính
secondary_hex = "#94A3B8"
secondary_rgb = [148, 163, 184]# Xám sáng cho Nội dung phụ / body
accent_hex = "#38BDF8"
accent_rgb = [56, 189, 248]

# -------------------------------------------------------------
# QUY CHUẨN TYPOGRAPHY (Bộ font Lexend chống lỗi tiếng Việt)
# -------------------------------------------------------------
[typography]
font_family = "Lexend"
font_family_fallback = "Arial"

[typography.title_hero]
size_pt = 44
bold = true
color = "colors.text.primary_rgb"

[typography.title_section]
size_pt = 26
bold = true
color = "colors.text.primary_rgb"

[typography.card_title]
size_pt = 18
bold = true
color = "colors.text.primary_rgb"

[typography.card_body]
size_pt = 13
bold = false
line_spacing = 1.25
color = "colors.text.secondary_rgb"

[typography.tag]
size_pt = 10
bold = true
color = "colors.accent.primary_rgb"

[typography.big_metric]
size_pt = 48
bold = true
color = "colors.accent.primary_rgb"

# =============================================================
# CẤU TRÚC CÁC LAYOUT MẪU (Tính theo Inch để python-pptx dựng trực tiếp)
# =============================================================

# --- Layout 1: Trang tiêu đề (Hero Cover) ---
[layouts.hero_title]
id = "hero_cover"
description = "Trang bìa mở đầu với Card căn giữa và Tag phân loại"

[layouts.hero_title.card]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 2.00
top_inch = 1.75
width_inch = 9.333
height_inch = 4.00
fill = "colors.card.bg_rgb"
border = "colors.card.border_rgb"
corner_radius = 0.05

[layouts.hero_title.elements.tag]
type = "text"
left_inch = 2.60
top_inch = 2.30
width_inch = 8.133
height_inch = 0.40
style = "typography.tag"
default = "PROJECT WORKSPACE / REPORT"

[layouts.hero_title.elements.title]
type = "text"
left_inch = 2.60
top_inch = 2.80
width_inch = 8.133
height_inch = 1.60
style = "typography.title_hero"
default = "Tiêu đề bản thuyết trình"

[layouts.hero_title.elements.subtitle]
type = "text"
left_inch = 2.60
top_inch = 4.50
width_inch = 8.133
height_inch = 0.80
style = "typography.card_body"
default = "Mô tả ngắn gọn về mục tiêu, giải pháp hoặc lộ trình triển khai"


# --- Layout 2: Bố cục 3 Card nằm ngang (Bento 3 Columns) ---
[layouts.three_cards]
id = "three_columns_cards"
description = "Slide trình bày 3 nội dung, 3 tính năng hoặc 3 bước triển khai"

# Khung tiêu đề slide
[layouts.three_cards.header]
left_inch = 1.00
top_inch = 0.80
width_inch = 11.333
height_inch = 0.80
style = "typography.title_section"
default = "3 Trọng Tâm Phát Triển"

# Thông số chung cho 3 card
[layouts.three_cards.grid_meta]
count = 3
top_inch = 2.00
height_inch = 4.60
width_inch = 3.50
gap_inch = 0.416
left_margin_inch = 1.00

# Thẻ thứ 1
[layouts.three_cards.card_1]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 1.00
top_inch = 2.00
width_inch = 3.50
height_inch = 4.60
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "01 / GIAI ĐOẠN 1"
title_default = "Phân tích yêu cầu"
body_default = "Tổng hợp toàn bộ tài liệu đầu vào, lược đồ cơ sở dữ liệu và yêu cầu tích hợp mạng LAN."

# Thẻ thứ 2
[layouts.three_cards.card_2]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 4.916
top_inch = 2.00
width_inch = 3.50
height_inch = 4.60
accent_bar_color = "colors.accent.secondary_rgb"
badge_text = "02 / GIAI ĐOẠN 2"
title_default = "Xây dựng lõi"
body_default = "Tạo engine tự sinh mã với python-pptx, tối ưu bảng màu và font tiếng Việt Lexend."

# Thẻ thứ 3
[layouts.three_cards.card_3]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 8.832
top_inch = 2.00
width_inch = 3.50
height_inch = 4.60
accent_bar_color = "colors.accent.success_rgb"
badge_text = "03 / GIAI ĐOẠN 3"
title_default = "Triển khai LAN"
body_default = "Chạy máy chủ backend nội bộ, quản trị cơ chế lưu vết TOML an toàn trước khi công khai."


# --- Layout 3: Chỉ số phóng to (Key Metrics / Dashboard) ---
[layouts.metric_highlights]
id = "metrics_callout"
description = "Slide làm nổi bật các con số then chốt, kết quả đạt được"

[layouts.metric_highlights.header]
left_inch = 1.00
top_inch = 0.80
width_inch = 11.333
height_inch = 0.80
style = "typography.title_section"
default = "Kết Quả Đo Lường Hiệu Năng"

# Card trái: Số liệu chính
[layouts.metric_highlights.card_left]
left_inch = 1.00
top_inch = 2.00
width_inch = 5.45
height_inch = 4.60
metric_number = "99.8%"
metric_label = "Độ chính xác bố cục"
metric_desc = "Tự động căn chỉnh tọa độ vector chính xác không bị tràn chữ tiếng Việt nhờ font Lexend."

# Card phải: Số liệu bổ trợ
[layouts.metric_highlights.card_right]
left_inch = 6.88
top_inch = 2.00
width_inch = 5.45
height_inch = 4.60
metric_number = "< 1.5s"
metric_label = "Thời gian sinh slide"
metric_desc = "Pipeline xử lý trực tiếp trên RAM và xuất file PPTX tức thì trên web server LAN."