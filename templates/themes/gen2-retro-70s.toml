[theme]
id = "gen2-retro-70s"
name = "Retro 70s Layout"
description = "Phong cách thập niên 70 với tông cam nâu ấm, hình khối bo tròn mạnh, badge đậm và typography đậm chất hoài cổ, tỷ lệ 16:9, tối ưu tiếng Việt."
style = "retro-70s-layout"
tags = [
    "retro",
    "70s",
    "warm",
    "vintage",
    "bold",
]
renderer = "theme"
font = "Poppins"
title_layout = "split_panel"
header_layout = "badge"
content_layout = "numbered_bands"

[palette]
bg = [
    43,
    27,
    18,
]
card = [
    92,
    58,
    34,
]
accent = [
    230,
    126,
    34,
]
text = [
    250,
    235,
    210,
]
muted = [
    196,
    164,
    132,
]

[canvas]
width_inch = 13.333
height_inch = 7.5
aspect_ratio = "16:9"

[colors.background]
hex = "#2B1B12"
rgb = [
    43,
    27,
    18,
]

[colors.card]
bg_hex = "#5C3A22"
bg_rgb = [
    92,
    58,
    34,
]
border_hex = "#7A4E2D"
border_rgb = [
    122,
    78,
    45,
]
border_width_pt = 2.0

[colors.accent]
primary_hex = "#E67E22"
primary_rgb = [
    230,
    126,
    34,
]
secondary_hex = "#D35400"
secondary_rgb = [
    211,
    84,
    0,
]
success_hex = "#A3B18A"
success_rgb = [
    163,
    177,
    138,
]

[colors.text]
primary_hex = "#FAEBD2"
primary_rgb = [
    250,
    235,
    210,
]
secondary_hex = "#C4A484"
secondary_rgb = [
    196,
    164,
    132,
]
accent_hex = "#E67E22"
accent_rgb = [
    230,
    126,
    34,
]

[typography]
font_family = "Poppins"
font_family_fallback = "Arial"

[typography.title_hero]
size_pt = 52
bold = true
color = "colors.text.primary_rgb"

[typography.title_section]
size_pt = 30
bold = true
color = "colors.text.primary_rgb"

[typography.card_title]
size_pt = 20
bold = true
color = "colors.text.primary_rgb"

[typography.card_body]
size_pt = 13
bold = false
line_spacing = 1.3
color = "colors.text.secondary_rgb"

[typography.tag]
size_pt = 11
bold = true
color = "colors.accent.primary_rgb"

[typography.big_metric]
size_pt = 56
bold = true
color = "colors.accent.primary_rgb"

[layouts.hero_title]
id = "hero_cover"
description = "Trang bìa retro với card bo tròn lớn, badge đậm và tiêu đề hoài cổ"

[layouts.hero_title.card]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 1.4
top_inch = 1.3
width_inch = 10.533
height_inch = 4.9
fill = "colors.card.bg_rgb"
border = "colors.card.border_rgb"
corner_radius = 0.22

[layouts.hero_title.elements.tag]
type = "text"
left_inch = 2.1
top_inch = 1.95
width_inch = 9.133
height_inch = 0.45
style = "typography.tag"
default = "★ RETRO SESSION / 1974 ★"

[layouts.hero_title.elements.title]
type = "text"
left_inch = 2.1
top_inch = 2.55
width_inch = 9.133
height_inch = 1.9
style = "typography.title_hero"
default = "Tiêu đề bản thuyết trình"

[layouts.hero_title.elements.subtitle]
type = "text"
left_inch = 2.1
top_inch = 4.65
width_inch = 9.133
height_inch = 0.9
style = "typography.card_body"
default = "Mô tả ngắn gọn về mục tiêu, giải pháp hoặc lộ trình triển khai"

[layouts.three_cards]
id = "three_columns_cards"
description = "Ba thẻ bo tròn mạnh với badge đậm phong cách thập niên 70"

[layouts.three_cards.header]
left_inch = 1.2
top_inch = 0.7
width_inch = 10.933
height_inch = 0.9
style = "typography.title_section"
default = "3 Trọng Tâm Phát Triển"

[layouts.three_cards.grid_meta]
count = 3
top_inch = 1.95
height_inch = 4.75
width_inch = 3.55
gap_inch = 0.4
left_margin_inch = 1.2

[layouts.three_cards.card_1]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 1.2
top_inch = 1.95
width_inch = 3.55
height_inch = 4.75
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "01 / GIAI ĐOẠN 1"
title_default = "Phân tích yêu cầu"
body_default = "Tổng hợp toàn bộ tài liệu đầu vào, lược đồ cơ sở dữ liệu và yêu cầu tích hợp mạng LAN."
corner_radius = 0.18

[layouts.three_cards.card_2]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 5.15
top_inch = 1.95
width_inch = 3.55
height_inch = 4.75
accent_bar_color = "colors.accent.secondary_rgb"
badge_text = "02 / GIAI ĐOẠN 2"
title_default = "Xây dựng lõi"
body_default = "Tạo engine tự sinh mã với python-pptx, tối ưu bảng màu và font tiếng Việt Poppins."
corner_radius = 0.18

[layouts.three_cards.card_3]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 9.1
top_inch = 1.95
width_inch = 3.55
height_inch = 4.75
accent_bar_color = "colors.accent.success_rgb"
badge_text = "03 / GIAI ĐOẠN 3"
title_default = "Triển khai LAN"
body_default = "Chạy máy chủ backend nội bộ, quản trị cơ chế lưu vết TOML an toàn trước khi công khai."
corner_radius = 0.18

[layouts.metric_highlights]
id = "metrics_callout"
description = "Slide làm nổi bật các con số then chốt với khối bo tròn retro"

[layouts.metric_highlights.header]
left_inch = 1.2
top_inch = 0.7
width_inch = 10.933
height_inch = 0.9
style = "typography.title_section"
default = "Kết Quả Đo Lường Hiệu Năng"

[layouts.metric_highlights.card_left]
left_inch = 1.2
top_inch = 1.95
width_inch = 5.35
height_inch = 4.75
metric_number = "99.8%"
metric_label = "Độ chính xác bố cục"
metric_desc = "Tự động căn chỉnh tọa độ vector chính xác không bị tràn chữ tiếng Việt nhờ font Poppins."
corner_radius = 0.22

[layouts.metric_highlights.card_right]
left_inch = 6.78
top_inch = 1.95
width_inch = 5.35
height_inch = 4.75
metric_number = "< 1.5s"
metric_label = "Thời gian sinh slide"
metric_desc = "Pipeline xử lý trực tiếp trên RAM và xuất file PPTX tức thì trên web server LAN."
corner_radius = 0.22

