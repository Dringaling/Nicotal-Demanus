[theme]
id = "gen-dark-academia"
name = "Dark Academia"
description = "Bố cục dày đặc kiểu học thuật cổ điển, nền nâu trầm, chữ serif trang trọng, tỷ lệ 16:9, tối ưu tiếng Việt có dấu/không dấu."
style = "dark-academia"
tags = [
    "dark",
    "academia",
    "vintage",
    "serif",
    "warm",
]
renderer = "theme"
font = "Playfair Display"

[palette]
bg = [
    28,
    22,
    18,
]
card = [
    44,
    35,
    28,
]
accent = [
    198,
    156,
    92,
]
text = [
    235,
    224,
    204,
]
muted = [
    150,
    130,
    108,
]

[canvas]
width_inch = 13.333
height_inch = 7.5
aspect_ratio = "16:9"

[colors.background]
hex = "#1C1612"
rgb = [
    28,
    22,
    18,
]

[colors.card]
bg_hex = "#2C231C"
bg_rgb = [
    44,
    35,
    28,
]
border_hex = "#4A3B2E"
border_rgb = [
    74,
    59,
    46,
]
border_width_pt = 1.25

[colors.accent]
primary_hex = "#C69C5C"
primary_rgb = [
    198,
    156,
    92,
]
secondary_hex = "#8C3B2E"
secondary_rgb = [
    140,
    59,
    46,
]
success_hex = "#6E7A4E"
success_rgb = [
    110,
    122,
    78,
]

[colors.text]
primary_hex = "#EBE0CC"
primary_rgb = [
    235,
    224,
    204,
]
secondary_hex = "#96826C"
secondary_rgb = [
    150,
    130,
    108,
]
accent_hex = "#C69C5C"
accent_rgb = [
    198,
    156,
    92,
]

[typography]
font_family = "Playfair Display"
font_family_fallback = "Georgia"

[typography.title_hero]
size_pt = 50
bold = true
color = "colors.text.primary_rgb"

[typography.title_section]
size_pt = 30
bold = true
color = "colors.text.primary_rgb"

[typography.card_title]
size_pt = 20
bold = true
color = "colors.text.primary_rgb"

[typography.card_body]
size_pt = 13
bold = false
line_spacing = 1.35
color = "colors.text.secondary_rgb"

[typography.tag]
size_pt = 11
bold = true
color = "colors.accent.primary_rgb"

[typography.big_metric]
size_pt = 54
bold = true
color = "colors.accent.primary_rgb"

[layouts.hero_title]
id = "hero_cover"
description = "Trang bìa học thuật với khung card rộng, viền kép và tag phân loại"

[layouts.hero_title.card]
shape_type = "RECTANGLE"
left_inch = 1.4
top_inch = 1.3
width_inch = 10.533
height_inch = 4.9
fill = "colors.card.bg_rgb"
border = "colors.card.border_rgb"
corner_radius = 0.0

[layouts.hero_title.elements.tag]
type = "text"
left_inch = 2.1
top_inch = 1.85
width_inch = 9.133
height_inch = 0.4
style = "typography.tag"
default = "CHUYÊN ĐỀ HỌC THUẬT / LUẬN VĂN"

[layouts.hero_title.elements.title]
type = "text"
left_inch = 2.1
top_inch = 2.45
width_inch = 9.133
height_inch = 1.9
style = "typography.title_hero"
default = "Tiêu đề bản thuyết trình"

[layouts.hero_title.elements.subtitle]
type = "text"
left_inch = 2.1
top_inch = 4.65
width_inch = 9.133
height_inch = 0.9
style = "typography.card_body"
default = "Mô tả ngắn gọn về mục tiêu, giải pháp hoặc lộ trình triển khai"

[layouts.three_cards]
id = "three_columns_cards"
description = "Slide trình bày 3 nội dung, 3 tính năng hoặc 3 bước triển khai"

[layouts.three_cards.header]
left_inch = 1.4
top_inch = 0.7
width_inch = 10.533
height_inch = 0.9
style = "typography.title_section"
default = "3 Trọng Tâm Phát Triển"

[layouts.three_cards.grid_meta]
count = 3
top_inch = 2.1
height_inch = 4.4
width_inch = 3.3
gap_inch = 0.316
left_margin_inch = 1.4

[layouts.three_cards.card_1]
shape_type = "RECTANGLE"
left_inch = 1.4
top_inch = 2.1
width_inch = 3.3
height_inch = 4.4
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "I / GIAI ĐOẠN 1"
title_default = "Phân tích yêu cầu"
body_default = "Tổng hợp toàn bộ tài liệu đầu vào, lược đồ cơ sở dữ liệu và yêu cầu tích hợp mạng LAN."

[layouts.three_cards.card_2]
shape_type = "RECTANGLE"
left_inch = 5.016
top_inch = 2.1
width_inch = 3.3
height_inch = 4.4
accent_bar_color = "colors.accent.secondary_rgb"
badge_text = "II / GIAI ĐOẠN 2"
title_default = "Xây dựng lõi"
body_default = "Tạo engine tự sinh mã với python-pptx, tối ưu bảng màu và font tiếng Việt Lexend."

[layouts.three_cards.card_3]
shape_type = "RECTANGLE"
left_inch = 8.632
top_inch = 2.1
width_inch = 3.3
height_inch = 4.4
accent_bar_color = "colors.accent.success_rgb"
badge_text = "III / GIAI ĐOẠN 3"
title_default = "Triển khai LAN"
body_default = "Chạy máy chủ backend nội bộ, quản trị cơ chế lưu vết TOML an toàn trước khi công khai."

[layouts.metric_highlights]
id = "metrics_callout"
description = "Slide làm nổi bật các con số then chốt, kết quả đạt được"

[layouts.metric_highlights.header]
left_inch = 1.4
top_inch = 0.7
width_inch = 10.533
height_inch = 0.9
style = "typography.title_section"
default = "Kết Quả Đo Lường Hiệu Năng"

[layouts.metric_highlights.card_left]
left_inch = 1.4
top_inch = 2.1
width_inch = 5.1
height_inch = 4.4
metric_number = "99.8%"
metric_label = "Độ chính xác bố cục"
metric_desc = "Tự động căn chỉnh tọa độ vector chính xác không bị tràn chữ tiếng Việt nhờ font serif hỗ trợ dấu đầy đủ."

[layouts.metric_highlights.card_right]
left_inch = 6.83
top_inch = 2.1
width_inch = 5.1
height_inch = 4.4
metric_number = "< 1.5s"
metric_label = "Thời gian sinh slide"
metric_desc = "Pipeline xử lý trực tiếp trên RAM và xuất file PPTX tức thì trên web server LAN."

[variants.alt]
name = "Alt"
