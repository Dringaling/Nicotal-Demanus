[theme]
id = "gen-neon-cyberpunk"
name = "Neon Cyberpunk"
description = "Giao diện tương lai tối sâu, viền neon rực, thẻ góc cạnh (angular), điểm nhấn cyan/magenta, tỷ lệ 16:9, tối ưu tiếng Việt."
style = "neon-cyberpunk"
tags = [
    "dark",
    "neon",
    "cyberpunk",
    "futuristic",
]
renderer = "theme"
font = "Lexend"

[palette]
bg = [
    8,
    6,
    18,
]
card = [
    20,
    16,
    38,
]
accent = [
    0,
    255,
    224,
]
text = [
    236,
    240,
    255,
]
muted = [
    130,
    120,
    170,
]

[canvas]
width_inch = 13.333
height_inch = 7.5
aspect_ratio = "16:9"

[colors.background]
hex = "#080612"
rgb = [
    8,
    6,
    18,
]

[colors.card]
bg_hex = "#141026"
bg_rgb = [
    20,
    16,
    38,
]
border_hex = "#2E2352"
border_rgb = [
    46,
    35,
    82,
]
border_width_pt = 1.5

[colors.accent]
primary_hex = "#00FFE0"
primary_rgb = [
    0,
    255,
    224,
]
secondary_hex = "#FF2E97"
secondary_rgb = [
    255,
    46,
    151,
]
success_hex = "#B14BFF"
success_rgb = [
    177,
    75,
    255,
]

[colors.text]
primary_hex = "#ECF0FF"
primary_rgb = [
    236,
    240,
    255,
]
secondary_hex = "#8278AA"
secondary_rgb = [
    130,
    120,
    170,
]
accent_hex = "#00FFE0"
accent_rgb = [
    0,
    255,
    224,
]

[typography]
font_family = "Lexend"
font_family_fallback = "Arial"

[typography.title_hero]
size_pt = 56
bold = true
color = "colors.text.primary_rgb"

[typography.title_section]
size_pt = 30
bold = true
color = "colors.text.primary_rgb"

[typography.card_title]
size_pt = 19
bold = true
color = "colors.text.primary_rgb"

[typography.card_body]
size_pt = 12
bold = false
line_spacing = 1.3
color = "colors.text.secondary_rgb"

[typography.tag]
size_pt = 10
bold = true
color = "colors.accent.primary_rgb"

[typography.big_metric]
size_pt = 64
bold = true
color = "colors.accent.primary_rgb"

[layouts.hero_title]
id = "hero_cover"
description = "Trang bìa lệch trái với khối góc cạnh, dải neon dọc và tag hệ thống"

[layouts.hero_title.card]
shape_type = "RECTANGLE"
left_inch = 0.85
top_inch = 1.1
width_inch = 8.6
height_inch = 5.3
fill = "colors.card.bg_rgb"
border = "colors.accent.primary_rgb"
corner_radius = 0.0

[layouts.hero_title.elements.tag]
type = "text"
left_inch = 1.35
top_inch = 1.65
width_inch = 7.6
height_inch = 0.4
style = "typography.tag"
default = "// SYSTEM ONLINE — NEON PROTOCOL"

[layouts.hero_title.elements.title]
type = "text"
left_inch = 1.35
top_inch = 2.2
width_inch = 7.6
height_inch = 2.4
style = "typography.title_hero"
default = "Tiêu đề bản thuyết trình"

[layouts.hero_title.elements.subtitle]
type = "text"
left_inch = 1.35
top_inch = 4.9
width_inch = 7.6
height_inch = 1.0
style = "typography.card_body"
default = "Mô tả ngắn gọn về mục tiêu, giải pháp hoặc lộ trình triển khai"

[layouts.hero_title.elements.accent_bar]
type = "shape"
shape_type = "RECTANGLE"
left_inch = 10.1
top_inch = 1.1
width_inch = 0.22
height_inch = 5.3
fill = "colors.accent.secondary_rgb"
border = "colors.accent.secondary_rgb"

[layouts.three_cards]
id = "three_columns_cards"
description = "Slide 3 nội dung với thẻ góc cạnh, dải neon trên đỉnh và badge số thứ tự"

[layouts.three_cards.header]
left_inch = 0.85
top_inch = 0.65
width_inch = 11.633
height_inch = 0.85
style = "typography.title_section"
default = "3 Trọng Tâm Phát Triển"

[layouts.three_cards.grid_meta]
count = 3
top_inch = 1.95
height_inch = 4.85
width_inch = 3.6
gap_inch = 0.4
left_margin_inch = 0.85

[layouts.three_cards.card_1]
shape_type = "RECTANGLE"
left_inch = 0.85
top_inch = 1.95
width_inch = 3.6
height_inch = 4.85
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "01 // PHASE"
title_default = "Phân tích yêu cầu"
body_default = "Tổng hợp toàn bộ tài liệu đầu vào, lược đồ cơ sở dữ liệu và yêu cầu tích hợp mạng LAN."

[layouts.three_cards.card_2]
shape_type = "RECTANGLE"
left_inch = 4.85
top_inch = 1.95
width_inch = 3.6
height_inch = 4.85
accent_bar_color = "colors.accent.secondary_rgb"
badge_text = "02 // PHASE"
title_default = "Xây dựng lõi"
body_default = "Tạo engine tự sinh mã với python-pptx, tối ưu bảng màu và font tiếng Việt Lexend."

[layouts.three_cards.card_3]
shape_type = "RECTANGLE"
left_inch = 8.85
top_inch = 1.95
width_inch = 3.6
height_inch = 4.85
accent_bar_color = "colors.accent.success_rgb"
badge_text = "03 // PHASE"
title_default = "Triển khai LAN"
body_default = "Chạy máy chủ backend nội bộ, quản trị cơ chế lưu vết TOML an toàn trước khi công khai."

[layouts.metric_highlights]
id = "metrics_callout"
description = "Slide làm nổi bật số liệu then chốt với khối góc cạnh và viền neon"

[layouts.metric_highlights.header]
left_inch = 0.85
top_inch = 0.65
width_inch = 11.633
height_inch = 0.85
style = "typography.title_section"
default = "Kết Quả Đo Lường Hiệu Năng"

[layouts.metric_highlights.card_left]
left_inch = 0.85
top_inch = 1.95
width_inch = 5.65
height_inch = 4.85
metric_number = "99.8%"
metric_label = "Độ chính xác bố cục"
metric_desc = "Tự động căn chỉnh tọa độ vector chính xác không bị tràn chữ tiếng Việt nhờ font Lexend."

[layouts.metric_highlights.card_right]
left_inch = 6.83
top_inch = 1.95
width_inch = 5.65
height_inch = 4.85
metric_number = "< 1.5s"
metric_label = "Thời gian sinh slide"
metric_desc = "Pipeline xử lý trực tiếp trên RAM và xuất file PPTX tức thì trên web server LAN."

[variants.alt]
name = "Alt"
description = "Đảo sáng/tối, giữ nguyên layout và accent."
style = "neon-cyberpunk-alt"
tags = [
    "generated",
    "variant",
]

