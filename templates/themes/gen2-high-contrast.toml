[theme]
id = "gen2-high-contrast"
name = "High Contrast Layout"
description = "Đen trắng vàng tương phản cực đại, chữ rất lớn, viền dày mạnh, ưu tiên tuyệt đối khả năng đọc, tỷ lệ 16:9, tối ưu tiếng Việt."
style = "high-contrast-layout"
tags = [
    "high-contrast",
    "bold",
    "accessible",
    "monochrome",
]
renderer = "theme"
font = "Arial"
title_layout = "full_bleed"
header_layout = "band"
content_layout = "timeline"

[palette]
bg = [
    0,
    0,
    0,
]
card = [
    18,
    18,
    18,
]
accent = [
    255,
    214,
    0,
]
text = [
    255,
    255,
    255,
]
muted = [
    200,
    200,
    200,
]

[canvas]
width_inch = 13.333
height_inch = 7.5
aspect_ratio = "16:9"

[colors.background]
hex = "#000000"
rgb = [
    0,
    0,
    0,
]

[colors.card]
bg_hex = "#121212"
bg_rgb = [
    18,
    18,
    18,
]
border_hex = "#FFFFFF"
border_rgb = [
    255,
    255,
    255,
]
border_width_pt = 4.0

[colors.accent]
primary_hex = "#FFD600"
primary_rgb = [
    255,
    214,
    0,
]
secondary_hex = "#FFFFFF"
secondary_rgb = [
    255,
    255,
    255,
]
success_hex = "#FFD600"
success_rgb = [
    255,
    214,
    0,
]

[colors.text]
primary_hex = "#FFFFFF"
primary_rgb = [
    255,
    255,
    255,
]
secondary_hex = "#C8C8C8"
secondary_rgb = [
    200,
    200,
    200,
]
accent_hex = "#FFD600"
accent_rgb = [
    255,
    214,
    0,
]

[typography]
font_family = "Arial"
font_family_fallback = "Helvetica"

[typography.title_hero]
size_pt = 72
bold = true
color = "colors.text.primary_rgb"

[typography.title_section]
size_pt = 40
bold = true
color = "colors.text.primary_rgb"

[typography.card_title]
size_pt = 24
bold = true
color = "colors.text.primary_rgb"

[typography.card_body]
size_pt = 16
bold = false
line_spacing = 1.3
color = "colors.text.secondary_rgb"

[typography.tag]
size_pt = 14
bold = true
color = "colors.accent.primary_rgb"

[typography.big_metric]
size_pt = 96
bold = true
color = "colors.accent.primary_rgb"

[layouts.hero_title]
id = "hero_cover"
description = "Trang bìa tương phản cao với khối viền trắng dày và dải vàng bên trái"

[layouts.hero_title.card]
shape_type = "RECTANGLE"
left_inch = 0.6
top_inch = 0.6
width_inch = 12.133
height_inch = 6.3
fill = "colors.card.bg_rgb"
border = "colors.card.border_rgb"
corner_radius = 0.0

[layouts.hero_title.elements.tag]
type = "text"
left_inch = 1.6
top_inch = 1.1
width_inch = 10.533
height_inch = 0.55
style = "typography.tag"
default = "BÁO CÁO / TÀI LIỆU"

[layouts.hero_title.elements.title]
type = "text"
left_inch = 1.6
top_inch = 1.9
width_inch = 10.533
height_inch = 2.6
style = "typography.title_hero"
default = "Tiêu đề bản thuyết trình"

[layouts.hero_title.elements.subtitle]
type = "text"
left_inch = 1.6
top_inch = 4.9
width_inch = 10.533
height_inch = 1.4
style = "typography.card_body"
default = "Mô tả ngắn gọn về mục tiêu, giải pháp hoặc lộ trình triển khai"

[layouts.hero_title.elements.accent_bar]
type = "shape"
shape_type = "RECTANGLE"
left_inch = 0.6
top_inch = 0.6
width_inch = 0.55
height_inch = 6.3
fill = "colors.accent.primary_rgb"
border = "colors.accent.primary_rgb"

[layouts.three_cards]
id = "three_columns_cards"
description = "Ba khối viền trắng dày, tiêu đề lớn, dải vàng đỉnh mỗi thẻ"

[layouts.three_cards.header]
left_inch = 0.6
top_inch = 0.55
width_inch = 12.133
height_inch = 0.95
style = "typography.title_section"
default = "3 Trọng Tâm Phát Triển"

[layouts.three_cards.grid_meta]
count = 3
top_inch = 1.9
height_inch = 4.9
width_inch = 3.85
gap_inch = 0.3
left_margin_inch = 0.6

[layouts.three_cards.card_1]
shape_type = "RECTANGLE"
left_inch = 0.6
top_inch = 1.9
width_inch = 3.85
height_inch = 4.9
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "01"
title_default = "Phân tích yêu cầu"
body_default = "Tổng hợp toàn bộ tài liệu đầu vào, lược đồ cơ sở dữ liệu và yêu cầu tích hợp mạng LAN."

[layouts.three_cards.card_2]
shape_type = "RECTANGLE"
left_inch = 4.75
top_inch = 1.9
width_inch = 3.85
height_inch = 4.9
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "02"
title_default = "Xây dựng lõi"
body_default = "Tạo engine tự sinh mã với python-pptx, tối ưu bảng màu và font tiếng Việt."

[layouts.three_cards.card_3]
shape_type = "RECTANGLE"
left_inch = 8.9
top_inch = 1.9
width_inch = 3.85
height_inch = 4.9
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "03"
title_default = "Triển khai LAN"
body_default = "Chạy máy chủ backend nội bộ, quản trị cơ chế lưu vết TOML an toàn trước khi công khai."

[layouts.metric_highlights]
id = "metrics_callout"
description = "Hai khối số liệu khổng lồ màu vàng trên nền đen, viền trắng dày"

[layouts.metric_highlights.header]
left_inch = 0.6
top_inch = 0.55
width_inch = 12.133
height_inch = 0.95
style = "typography.title_section"
default = "Kết Quả Đo Lường Hiệu Năng"

[layouts.metric_highlights.card_left]
left_inch = 0.6
top_inch = 1.9
width_inch = 5.9
height_inch = 4.9
metric_number = "99.8%"
metric_label = "Độ chính xác bố cục"
metric_desc = "Tự động căn chỉnh tọa độ vector chính xác không bị tràn chữ tiếng Việt."

[layouts.metric_highlights.card_right]
left_inch = 6.83
top_inch = 1.9
width_inch = 5.9
height_inch = 4.9
metric_number = "< 1.5s"
metric_label = "Thời gian sinh slide"
metric_desc = "Pipeline xử lý trực tiếp trên RAM và xuất file PPTX tức thì trên web server LAN."

[variants.alt]
name = "Alt"
description = "Đảo sáng/tối, giữ nguyên layout và accent."
style = "high-contrast-layout-alt"
tags = [
    "generated",
    "variant",
]

[variants.alt.palette]
bg = [
    255,
    255,
    255,
]
card = [
    255,
    255,
    255,
]
accent = [
    255,
    214,
    0,
]
text = [
    0,
    0,
    0,
]
muted = [
    200,
    200,
    200,
]

[variants.alt.colors.background]
hex = "#FFFFFF"
rgb = [
    255,
    255,
    255,
]

[variants.alt.colors.card]
bg_hex = "#FFFFFF"
bg_rgb = [
    255,
    255,
    255,
]
border_hex = "#FFFFFF"
border_rgb = [
    255,
    255,
    255,
]
border_width_pt = 4.0

[variants.alt.colors.accent]
primary_hex = "#FFD600"
primary_rgb = [
    255,
    214,
    0,
]
secondary_hex = "#FFFFFF"
secondary_rgb = [
    255,
    255,
    255,
]
success_hex = "#FFD600"
success_rgb = [
    255,
    214,
    0,
]

[variants.alt.colors.text]
primary_hex = "#000000"
primary_rgb = [
    0,
