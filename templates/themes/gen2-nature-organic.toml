[theme]
id = "gen2-nature-organic"
name = "Nature Organic Layout"
description = "Bố cục thẻ mềm mại tông xanh olive, nhịp điệu tự nhiên, khoảng thở rộng, tĩnh tại và thư thái, tỷ lệ 16:9, tối ưu tiếng Việt."
style = "nature-organic-layout"
tags = [
    "light",
    "organic",
    "nature",
    "olive",
    "calm",
]
renderer = "theme"
font = "Lexend"
title_layout = "full_bleed"
header_layout = "center"
content_layout = "centered_list"

[palette]
bg = [
    244,
    243,
    234,
]
card = [
    250,
    249,
    242,
]
accent = [
    122,
    138,
    74,
]
text = [
    52,
    58,
    40,
]
muted = [
    138,
    142,
    118,
]

[canvas]
width_inch = 13.333
height_inch = 7.5
aspect_ratio = "16:9"

[colors.background]
hex = "#F4F3EA"
rgb = [
    244,
    243,
    234,
]

[colors.card]
bg_hex = "#FAF9F2"
bg_rgb = [
    250,
    249,
    242,
]
border_hex = "#DDE0CE"
border_rgb = [
    221,
    224,
    206,
]
border_width_pt = 1.25

[colors.accent]
primary_hex = "#7A8A4A"
primary_rgb = [
    122,
    138,
    74,
]
secondary_hex = "#B08D57"
secondary_rgb = [
    176,
    141,
    87,
]
success_hex = "#8FA97A"
success_rgb = [
    143,
    169,
    122,
]

[colors.text]
primary_hex = "#343A28"
primary_rgb = [
    52,
    58,
    40,
]
secondary_hex = "#8A8E76"
secondary_rgb = [
    138,
    142,
    118,
]
accent_hex = "#7A8A4A"
accent_rgb = [
    122,
    138,
    74,
]

[typography]
font_family = "Lexend"
font_family_fallback = "Arial"

[typography.title_hero]
size_pt = 48
bold = true
color = "colors.text.primary_rgb"

[typography.title_section]
size_pt = 28
bold = true
color = "colors.text.primary_rgb"

[typography.card_title]
size_pt = 18
bold = true
color = "colors.text.primary_rgb"

[typography.card_body]
size_pt = 13
bold = false
line_spacing = 1.35
color = "colors.text.secondary_rgb"

[typography.tag]
size_pt = 10
bold = true
color = "colors.accent.primary_rgb"

[typography.big_metric]
size_pt = 54
bold = true
color = "colors.accent.primary_rgb"

[layouts.hero_title]
id = "hero_organic"
description = "Trang bìa mở đầu với thẻ mềm lệch trái, khoảng thở rộng, nhịp điệu tự nhiên"

[layouts.hero_title.card]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 1.1
top_inch = 1.3
width_inch = 8.4
height_inch = 4.9
fill = "colors.card.bg_rgb"
border = "colors.card.border_rgb"
corner_radius = 0.22

[layouts.hero_title.elements.tag]
type = "text"
left_inch = 1.7
top_inch = 1.95
width_inch = 7.2
height_inch = 0.4
style = "typography.tag"
default = "THIÊN NHIÊN / TỔ CHỨC BỀN VỮNG"

[layouts.hero_title.elements.title]
type = "text"
left_inch = 1.7
top_inch = 2.55
width_inch = 7.2
height_inch = 1.9
style = "typography.title_hero"
default = "Tiêu đề bản thuyết trình"

[layouts.hero_title.elements.subtitle]
type = "text"
left_inch = 1.7
top_inch = 4.65
width_inch = 7.2
height_inch = 1.1
style = "typography.card_body"
default = "Mô tả ngắn gọn về mục tiêu, giải pháp hoặc lộ trình triển khai"

[layouts.hero_title.elements.side_accent]
type = "shape"
shape_type = "ROUNDED_RECTANGLE"
left_inch = 10.1
top_inch = 1.3
width_inch = 2.1
height_inch = 4.9
fill = "colors.accent.primary_rgb"
corner_radius = 0.22

[layouts.three_cards]
id = "three_columns_organic"
description = "Slide trình bày 3 nội dung với thẻ mềm, khoảng cách rộng, nhịp điệu tự nhiên"

[layouts.three_cards.header]
left_inch = 1.1
top_inch = 0.7
width_inch = 11.133
height_inch = 0.85
style = "typography.title_section"
default = "3 Trọng Tâm Phát Triển"

[layouts.three_cards.grid_meta]
count = 3
top_inch = 1.95
height_inch = 4.75
width_inch = 3.45
gap_inch = 0.49
left_margin_inch = 1.1

[layouts.three_cards.card_1]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 1.1
top_inch = 1.95
width_inch = 3.45
height_inch = 4.75
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "01 / GIAI ĐOẠN 1"
title_default = "Phân tích yêu cầu"
body_default = "Tổng hợp toàn bộ tài liệu đầu vào, lược đồ cơ sở dữ liệu và yêu cầu tích hợp mạng LAN."
corner_radius = 0.2

[layouts.three_cards.card_2]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 5.04
top_inch = 1.95
width_inch = 3.45
height_inch = 4.75
accent_bar_color = "colors.accent.secondary_rgb"
badge_text = "02 / GIAI ĐOẠN 2"
title_default = "Xây dựng lõi"
body_default = "Tạo engine tự sinh mã với python-pptx, tối ưu bảng màu và font tiếng Việt Lexend."
corner_radius = 0.2

[layouts.three_cards.card_3]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 8.98
top_inch = 1.95
width_inch = 3.45
height_inch = 4.75
accent_bar_color = "colors.accent.success_rgb"
badge_text = "03 / GIAI ĐOẠN 3"
title_default = "Triển khai LAN"
body_default = "Chạy máy chủ backend nội bộ, quản trị cơ chế lưu vết TOML an toàn trước khi công khai."
corner_radius = 0.2

[layouts.metric_highlights]
id = "metrics_organic"
description = "Slide làm nổi bật các con số then chốt với thẻ mềm và khoảng thở rộng"

[layouts.metric_highlights.header]
left_inch = 1.1
top_inch = 0.7
width_inch = 11.133
height_inch = 0.85
style = "typography.title_section"
default = "Kết Quả Đo Lường Hiệu Năng"

[layouts.metric_highlights.card_left]
left_inch = 1.1
top_inch = 1.95
width_inch = 5.35
height_inch = 4.75
metric_number = "99.8%"
metric_label = "Độ chính xác bố cục"
metric_desc = "Tự động căn chỉnh tọa độ vector chính xác không bị tràn chữ tiếng Việt nhờ font Lexend."
corner_radius = 0.22

[layouts.metric_highlights.card_right]
left_inch = 6.88
top_inch = 1.95
width_inch = 5.35
height_inch = 4.75
metric_number = "< 1.5s"
metric_label = "Thời gian sinh slide"
metric_desc = "Pipeline xử lý trực tiếp trên RAM và xuất file PPTX tức thì trên web server LAN."
corner_radius = 0.22

[variants.alt]
name = "Alt"
