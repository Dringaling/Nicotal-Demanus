[theme]
id = "gen2-medical-clean"
name = "Medical Clean Layout"
description = "Giao diện y khoa sạch sẽ, nền trắng xanh, thẻ phẳng bo nhẹ, đường kẻ chính xác, tỷ lệ 16:9, tối ưu tiếng Việt có dấu/không dấu."
style = "medical-clean-layout"
tags = [
    "light",
    "medical",
    "clean",
    "clinical",
]
renderer = "theme"
font = "Inter"
title_layout = "top_band"
header_layout = "rail"
content_layout = "compact_cards"

[palette]
bg = [
    244,
    249,
    251,
]
card = [
    255,
    255,
    255,
]
accent = [
    0,
    128,
    156,
]
text = [
    22,
    48,
    58,
]
muted = [
    110,
    138,
    148,
]

[canvas]
width_inch = 13.333
height_inch = 7.5
aspect_ratio = "16:9"

[colors.background]
hex = "#F4F9FB"
rgb = [
    244,
    249,
    251,
]

[colors.card]
bg_hex = "#FFFFFF"
bg_rgb = [
    255,
    255,
    255,
]
border_hex = "#D6E6EC"
border_rgb = [
    214,
    230,
    236,
]
border_width_pt = 1.0

[colors.accent]
primary_hex = "#00809C"
primary_rgb = [
    0,
    128,
    156,
]
secondary_hex = "#3FA9C4"
secondary_rgb = [
    63,
    169,
    196,
]
success_hex = "#2E9E6B"
success_rgb = [
    46,
    158,
    107,
]
alert_hex = "#D9534F"
alert_rgb = [
    217,
    83,
    79,
]

[colors.text]
primary_hex = "#16303A"
primary_rgb = [
    22,
    48,
    58,
]
secondary_hex = "#6E8A94"
secondary_rgb = [
    110,
    138,
    148,
]
accent_hex = "#00809C"
accent_rgb = [
    0,
    128,
    156,
]

[typography]
font_family = "Inter"
font_family_fallback = "Arial"

[typography.title_hero]
size_pt = 40
bold = true
color = "colors.text.primary_rgb"

[typography.title_section]
size_pt = 24
bold = true
color = "colors.text.primary_rgb"

[typography.card_title]
size_pt = 16
bold = true
color = "colors.text.primary_rgb"

[typography.card_body]
size_pt = 12
bold = false
line_spacing = 1.3
color = "colors.text.secondary_rgb"

[typography.tag]
size_pt = 9
bold = true
color = "colors.accent.primary_rgb"

[typography.big_metric]
size_pt = 52
bold = true
color = "colors.accent.primary_rgb"

[layouts.hero_title]
id = "hero_cover"
description = "Trang bìa y khoa với card trắng rộng, đường kẻ teal bên trái và tag phân loại"

[layouts.hero_title.card]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 1.4
top_inch = 1.55
width_inch = 10.533
height_inch = 4.4
fill = "colors.card.bg_rgb"
border = "colors.card.border_rgb"
corner_radius = 0.03

[layouts.hero_title.elements.tag]
type = "text"
left_inch = 2.0
top_inch = 2.05
width_inch = 9.333
height_inch = 0.35
style = "typography.tag"
default = "HỒ SƠ LÂM SÀNG / BÁO CÁO"

[layouts.hero_title.elements.title]
type = "text"
left_inch = 2.0
top_inch = 2.55
width_inch = 9.333
height_inch = 1.7
style = "typography.title_hero"
default = "Tiêu đề báo cáo y khoa"

[layouts.hero_title.elements.subtitle]
type = "text"
left_inch = 2.0
top_inch = 4.6
width_inch = 9.333
height_inch = 0.9
style = "typography.card_body"
default = "Tóm tắt mục tiêu, phạm vi và kết luận chính của báo cáo."

[layouts.hero_title.elements.accent_bar]
type = "rect"
left_inch = 1.4
top_inch = 1.55
width_inch = 0.14
height_inch = 4.4
fill = "colors.accent.primary_rgb"

[layouts.hero_title.elements.divider]
type = "line"
left_inch = 2.0
top_inch = 4.4
width_inch = 9.333
height_inch = 0.02
color = "colors.card.border_rgb"

[layouts.three_cards]
id = "three_columns_cards"
description = "Slide trình bày 3 nội dung, 3 giai đoạn hoặc 3 khuyến nghị lâm sàng"

[layouts.three_cards.header]
left_inch = 1.4
top_inch = 0.7
width_inch = 10.533
height_inch = 0.7
style = "typography.title_section"
default = "Ba Trọng Tâm Can Thiệp"

[layouts.three_cards.grid_meta]
count = 3
top_inch = 1.85
height_inch = 4.75
width_inch = 3.3
gap_inch = 0.316
left_margin_inch = 1.4

[layouts.three_cards.card_1]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 1.4
top_inch = 1.85
width_inch = 3.3
height_inch = 4.75
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "01 / BƯỚC 1"
title_default = "Đánh giá ban đầu"
body_default = "Thu thập dữ liệu lâm sàng, tiền sử bệnh nhân và các chỉ số sinh tồn cơ bản."

[layouts.three_cards.card_2]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 5.016
top_inch = 1.85
width_inch = 3.3
height_inch = 4.75
accent_bar_color = "colors.accent.secondary_rgb"
badge_text = "02 / BƯỚC 2"
title_default = "Chẩn đoán phân biệt"
body_default = "Đối chiếu triệu chứng với danh mục bệnh lý, xếp hạng mức độ ưu tiên xử lý."

[layouts.three_cards.card_3]
shape_type = "ROUNDED_RECTANGLE"
left_inch = 8.632
top_inch = 1.85
width_inch = 3.3
height_inch = 4.75
accent_bar_color = "colors.accent.success_rgb"
badge_text = "03 / BƯỚC 3"
title_default = "Phác đồ điều trị"
body_default = "Đề xuất phác đồ, liều lượng và lịch theo dõi tái khám cho bệnh nhân."

[layouts.metric_highlights]
id = "metrics_callout"
description = "Slide làm nổi bật các con số then chốt, kết quả đo lường lâm sàng"

[layouts.metric_highlights.header]
left_inch = 1.4
top_inch = 0.7
width_inch = 10.533
height_inch = 0.7
style = "typography.title_section"
default = "Chỉ Số Hiệu Quả Điều Trị"

[layouts.metric_highlights.card_left]
left_inch = 1.4
top_inch = 1.85
width_inch = 5.1
height_inch = 4.75
metric_number = "98.4%"
metric_label = "Tỷ lệ tuân thủ phác đồ"
metric_desc = "Bệnh nhân hoàn thành đúng liệu trình điều trị theo hướng dẫn của bác sĩ điều trị."

[layouts.metric_highlights.card_right]
left_inch = 6.833
top_inch = 1.85
width_inch = 5.1
height_inch = 4.75
metric_number = "< 24h"
metric_label = "Thời gian phản hồi kết quả"
metric_desc = "Kết quả xét nghiệm được trả về hệ thống hồ sơ điện tử trong vòng một ngày làm việc."

[variants.alt]
name = "Alt"
description = "Đảo sáng/tối, giữ nguyên layout và accent."
