[theme]
id = "gen2-blueprint-tech"
name = "Blueprint Tech Layout"
description = "Bản vẽ kỹ thuật với lưới mảnh, nhãn chính xác, đường nét mảnh và cảm giác blueprint cổ điển trên nền xanh kỹ thuật số, tỷ lệ 16:9, tối ưu tiếng Việt."
style = "blueprint-tech-layout"
tags = [
    "blueprint",
    "technical",
    "grid",
    "dark",
    "cyan",
]
renderer = "theme"
font = "IBM Plex Mono"
title_layout = "top_band"
header_layout = "grid"
content_layout = "split_list"

[palette]
bg = [
    10,
    26,
    42,
]
card = [
    13,
    34,
    54,
]
accent = [
    125,
    211,
    252,
]
text = [
    226,
    240,
    250,
]
muted = [
    122,
    158,
    184,
]

[canvas]
width_inch = 13.333
height_inch = 7.5
aspect_ratio = "16:9"

[colors.background]
hex = "#0A1A2A"
rgb = [
    10,
    26,
    42,
]

[colors.card]
bg_hex = "#0D2236"
bg_rgb = [
    13,
    34,
    54,
]
border_hex = "#2A4A66"
border_rgb = [
    42,
    74,
    102,
]
border_width_pt = 0.75

[colors.accent]
primary_hex = "#7DD3FC"
primary_rgb = [
    125,
    211,
    252,
]
secondary_hex = "#FBBF24"
secondary_rgb = [
    251,
    191,
    36,
]
success_hex = "#34D399"
success_rgb = [
    52,
    211,
    153,
]

[colors.text]
primary_hex = "#E2F0FA"
primary_rgb = [
    226,
    240,
    250,
]
secondary_hex = "#7A9EB8"
secondary_rgb = [
    122,
    158,
    184,
]
accent_hex = "#7DD3FC"
accent_rgb = [
    125,
    211,
    252,
]

[colors.grid]
line_hex = "#1B3A54"
line_rgb = [
    27,
    58,
    84,
]
line_width_pt = 0.5
major_hex = "#2A4A66"
major_rgb = [
    42,
    74,
    102,
]
major_width_pt = 0.75
spacing_inch = 0.5

[typography]
font_family = "IBM Plex Mono"
font_family_fallback = "Consolas"

[typography.title_hero]
size_pt = 38
bold = true
color = "colors.text.primary_rgb"

[typography.title_section]
size_pt = 22
bold = true
color = "colors.text.primary_rgb"

[typography.card_title]
size_pt = 15
bold = true
color = "colors.text.primary_rgb"

[typography.card_body]
size_pt = 11
bold = false
line_spacing = 1.35
color = "colors.text.secondary_rgb"

[typography.tag]
size_pt = 9
bold = true
color = "colors.accent.primary_rgb"

[typography.big_metric]
size_pt = 54
bold = true
color = "colors.accent.primary_rgb"

[layouts.hero_title]
id = "hero_cover"
description = "Trang bìa blueprint với khung vẽ kỹ thuật, nhãn góc và đường chân trời"

[layouts.hero_title.card]
shape_type = "RECTANGLE"
left_inch = 0.75
top_inch = 0.75
width_inch = 11.833
height_inch = 6.0
fill = "colors.card.bg_rgb"
border = "colors.card.border_rgb"
corner_radius = 0.0

[layouts.hero_title.elements.tag]
type = "text"
left_inch = 1.1
top_inch = 1.05
width_inch = 6.0
height_inch = 0.3
style = "typography.tag"
default = "DWG NO. 001 / REV A / SCALE 1:1"

[layouts.hero_title.elements.title]
type = "text"
left_inch = 1.1
top_inch = 2.2
width_inch = 10.5
height_inch = 1.6
style = "typography.title_hero"
default = "Bản Vẽ Kỹ Thuật Hệ Thống"

[layouts.hero_title.elements.subtitle]
type = "text"
left_inch = 1.1
top_inch = 4.1
width_inch = 9.5
height_inch = 1.0
style = "typography.card_body"
default = "Sơ đồ kiến trúc, thông số kỹ thuật và lộ trình triển khai chi tiết theo tiêu chuẩn bản vẽ."

[layouts.hero_title.elements.rule]
type = "line"
left_inch = 1.1
top_inch = 3.9
width_inch = 10.5
height_inch = 0.0
color = "colors.accent.primary_rgb"
width_pt = 0.75

[layouts.hero_title.elements.corner_label]
type = "text"
left_inch = 9.6
top_inch = 6.2
width_inch = 2.8
height_inch = 0.3
style = "typography.tag"
default = "SHEET 01 / 12"

[layouts.three_cards]
id = "three_columns_cards"
description = "Ba khối kỹ thuật với đường viền mảnh, nhãn số thứ tự và đường chân trời"

[layouts.three_cards.header]
left_inch = 0.75
top_inch = 0.55
width_inch = 11.833
height_inch = 0.6
style = "typography.title_section"
default = "Ba Trục Kỹ Thuật Chính"

[layouts.three_cards.grid_meta]
count = 3
top_inch = 1.6
height_inch = 5.1
width_inch = 3.7
gap_inch = 0.366
left_margin_inch = 0.75

[layouts.three_cards.card_1]
shape_type = "RECTANGLE"
left_inch = 0.75
top_inch = 1.6
width_inch = 3.7
height_inch = 5.1
accent_bar_color = "colors.accent.primary_rgb"
badge_text = "01 / TRỤC X"
title_default = "Phân tích cấu trúc"
body_default = "Đo đạc, đối chiếu và chuẩn hóa toàn bộ dữ liệu đầu vào theo lưới tham chiếu kỹ thuật."

[layouts.three_cards.card_2]
shape_type = "RECTANGLE"
left_inch = 4.816
top_inch = 1.6
width_inch = 3.7
height_inch = 5.1
accent_bar_color = "colors.accent.secondary_rgb"
badge_text = "02 / TRỤC Y"
title_default = "Dựng khung lõi"
body_default = "Thiết lập engine sinh mã với python-pptx, căn chỉnh tọa độ tuyệt đối theo đơn vị inch."

[layouts.three_cards.card_3]
shape_type = "RECTANGLE"
left_inch = 8.882
top_inch = 1.6
width_inch = 3.7
height_inch = 5.1
accent_bar_color = "colors.accent.success_rgb"
badge_text = "03 / TRỤC Z"
title_default = "Kiểm định LAN"
body_default = "Chạy máy chủ nội bộ, xác minh lưu vết TOML và xuất bản bản vẽ hoàn chỉnh."

[layouts.metric_highlights]
id = "metrics_callout"
description = "Bảng thông số kỹ thuật với số liệu lớn và đường chân trời"

[layouts.metric_highlights.header]
left_inch = 0.75
top_inch = 0.55
width_inch = 11.833
height_inch = 0.6
style = "typography.title_section"
default = "Thông Số Đo Lường"

[layouts.metric_highlights.card_left]
left_inch = 0.75
top_inch = 1.6
width_inch = 5.85
height_inch = 5.1
metric_number = "99.8%"
metric_label = "ĐỘ CHÍNH XÁC BỐ CỤC"
metric_desc = "Căn chỉnh vector tuyệt đối, không tràn chữ tiếng Việt nhờ font IBM Plex Mono."

[layouts.metric_highlights.card_right]
left_inch = 6.733
top_inch = 1.6
width_inch = 5.85
height_inch = 5.1
metric_number = "< 1.5s"
metric_label = "THỜI GIAN SINH SLIDE"
metric_desc = "Pipeline xử lý trên RAM, xuất PPTX tức thì trên máy chủ LAN nội bộ."

[variants.alt]
name = "Alt"
